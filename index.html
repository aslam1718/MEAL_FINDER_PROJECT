<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MEAL FINDER WEBSITE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body>
    <nav>

        <div class="div1">

            <img src="/icon.png" alt="Meal Finder Logo">

            <h2 style="color: white;">MEAL FINDER</h2>

        </div>


        <!-- Hamburger Button -->
        <button class="btn hamburger-btn" type="button" data-bs-toggle="offcanvas" data-bs-target="#offcanvasRight"
            aria-controls="offcanvasRight">

            <i class="fa-solid fa-bars"></i>

        </button>

    </nav>


    <!-- RIGHT OFFCANVAS -->
    <div class="offcanvas offcanvas-end" tabindex="-1" id="offcanvasRight" aria-labelledby="offcanvasRightLabel">

        <div class="offcanvas-header">

            <h5 class="offcanvas-title" id="offcanvasRightLabel">
                MEAL FINDER
            </h5>

            <button type="button" class="btn-close" data-bs-dismiss="offcanvas" aria-label="Close">
            </button>

        </div>


        <div class="offcanvas-body">

            <div id="categoryList"></div>

        </div>

    </div>

    </div>

    </div>
    <section>
        <div class="div2">
            <input type="search">
            <a href=""><i class="fa-solid fa-magnifying-glass"></i></a>
            <h1>What are your favorite cuisines?</h1>
            <p>PERSONALIZE YOUR EXPERIENCE</p>
        </div>

    </section>


    <div id="mealList"></div>

    <!-- Bootstrap JavaScript -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="script.js"></script>

</body>

</html>
